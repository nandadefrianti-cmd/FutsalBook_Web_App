version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: futsal_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: futsal_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    container_name: futsal_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=database
      - DB_USER=postgres
      - DB_PASSWORD=password123
      - DB_NAME=futsal_booking
      - DB_PORT=5432
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: futsal_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: